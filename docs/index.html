<!doctype html>
<html lang="en">

<head>
   <meta charset="utf-8" />
   <title>Tuner</title>
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <meta name="description" content="Online chromatic tuner for practicing intonation on instruments in C, B-flat, E-flat, and F." />
   <meta name="author" content="Rafał Jopek" />
   <meta name="google" content="notranslate" />
   <link rel="canonical" href="https://jazzchordlab.github.io/tuner/" />
   <meta property="og:title" content="Free Online Tuner" />
   <meta property="og:description" content="A simple online tuner for instruments in C, B-flat, E-flat, and F." />
   <meta property="og:type" content="website" />
   <meta property="og:url" content="https://jazzchordlab.github.io/tuner/" />
   <meta property="og:image" content="https://jazzchordlab.github.io/tuner/img/tuner-social.png" />
   <meta property="og:image:type" content="image/png" />
   <meta property="og:image:width" content="1730" />
   <meta property="og:image:height" content="909" />
   <meta property="og:image:alt" content="Free Online Tuner for instruments in C, B-flat, E-flat, and F" />
   <meta name="twitter:card" content="summary_large_image" />
   <meta name="twitter:title" content="Free Online Tuner" />
   <meta name="twitter:description" content="A simple online tuner for instruments in C, B-flat, E-flat, and F." />
   <meta name="twitter:image" content="https://jazzchordlab.github.io/tuner/img/tuner-social.png" />
   <link rel="stylesheet" href="css/style.css" />
   <link rel="icon" type="image/svg+xml" href="img/tuner.svg" />
   <link rel="manifest" href="manifest.webmanifest">
   <meta name="theme-color" content="#0f172a">
</head>

<body>
   <h1>TUNER</h1>
   <div class="tuner-wrapper">
      <div class="tuner-box">
         <div class="tuner-title">
            <a href="https://jazzchordlab.com">Jazz Chord Lab</a>
         </div>
         <div class="note-display" id="note" aria-hidden="true">—</div>
         <div class="sr-only" id="noteStatus" role="status" aria-live="polite" aria-atomic="true"></div>

         <div class="bar-wrapper">
            <div class="bar-center-line"></div>
            <div class="bar-indicator" id="indicator"></div>
         </div>
         <div class="bar-labels">
            <span>-50 ¢</span>
            <span>0 ¢</span>
            <span>+50 ¢</span>
         </div>

         <div class="key-switcher">
            <button class="key-button" data-transpose="0">Instrument in C</button>
            <button class="key-button" data-transpose="2">Instrument in B♭</button>
            <button class="key-button" data-transpose="9">Instrument in E♭</button>
            <button class="key-button" data-transpose="7">Instrument in F</button>
         </div>

         <div class="tuner-actions">
            <button class="tuner-button" id="toggleButton">Start</button>
         </div>
         <div class="error" id="error" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
   </div>
      <div class="cta">
         <a class="link" href="https://github.com/JazzChordLab/tuner" target="_blank" rel="noreferrer">GitHub</a>
      </div>
      <div class="visitor-counter">
         <img
            src="https://hits.sh/jazzchordlab.github.io/tuner.svg?style=flat-square&amp;label=Musicians%20tuning%20in&amp;color=e5e7eb&amp;labelColor=f1f1f1"
            alt="Musicians tuning in: public visit count"
            referrerpolicy="no-referrer"
         />
      </div>
   <script type="module">

      import { PitchDetector } from "https://esm.sh/pitchy@4.1.0";
      import { frequencyToNoteNumber, noteNumberToName } from "./js/tuner-core.mjs";
      if ("serviceWorker" in navigator) {
         navigator.serviceWorker.register("./sw.js");
      }

      const noteEl = document.getElementById("note");
      const noteStatusEl = document.getElementById("noteStatus");
      const indicatorEl = document.getElementById("indicator");
      const errorEl = document.getElementById("error");
      const toggleButton = document.getElementById("toggleButton");
      const keyButtons = Array.from(document.querySelectorAll(".key-button"));

      let audioContext = null;
      let analyser = null;
      let detector = null;
      let buffer = null;
      let micStream = null;
      let running = false;
      let transpose = 0; // semitones: C=0, Bb=+2, Eb=+9, F=+7
      let starting = false;
      let pendingNoteAnnouncement = null;
      let pendingNoteStatus = "";
      let announcedNoteStatus = "";

      function announceStableNote(noteName, cents) {
         const tuning = Math.abs(cents) <= 5 ? "in tune" : cents < 0 ? "flat" : "sharp";
         const status = `${noteName}, ${tuning}.`;

         if (status === announcedNoteStatus || status === pendingNoteStatus) return;

         clearTimeout(pendingNoteAnnouncement);
         pendingNoteStatus = status;
         pendingNoteAnnouncement = setTimeout(() => {
            noteStatusEl.textContent = status;
            announcedNoteStatus = status;
            pendingNoteStatus = "";
         }, 600);
      }

      function updateUI(pitch, clarity) {
         if (!pitch || clarity < 0.8) {
            clearTimeout(pendingNoteAnnouncement);
            pendingNoteStatus = "";
            noteEl.textContent = "—";
            noteEl.classList.remove("note-hit", "note-miss");
            indicatorEl.style.left = "50%";
            return;
         }

         const noteNum = frequencyToNoteNumber(pitch);
         const transposed = noteNum + transpose;
         const fullName = noteNumberToName(transposed);
         const nearest = Math.round(transposed);
         const cents = Math.round((transposed - nearest) * 100);

         noteEl.textContent = fullName;
         announceStableNote(fullName, cents);
         noteEl.classList.remove("note-hit", "note-miss");
         if (Math.abs(cents) <= 5) {
            noteEl.classList.add("note-hit");
         } else {
            noteEl.classList.add("note-miss");
         }

         const maxCents = 50;
         let normalized = cents / maxCents;
         if (normalized > 1) normalized = 1;
         if (normalized < -1) normalized = -1;
         const percent = 50 + normalized * 50;
         indicatorEl.style.left = percent + "%";
      }

      async function startTuner() {
         if (starting) return;
         starting = true;
         toggleButton.disabled = true;
         errorEl.textContent = "";
         try {
            if (!navigator.mediaDevices?.getUserMedia) {
               throw new Error("Microphone access is not supported in this browser (HTTPS required).");
            }

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            await audioContext.resume();

            micStream = await navigator.mediaDevices.getUserMedia({
               audio: {
                  echoCancellation: false,
                  noiseSuppression: false,
                  autoGainControl: false,
               },
            });
            const source = audioContext.createMediaStreamSource(micStream);

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            const inputLength = analyser.fftSize;
            buffer = new Float32Array(inputLength);

            detector = PitchDetector.forFloat32Array(inputLength);

            source.connect(analyser);
            running = true;
            noteStatusEl.textContent = "Tuner started. Play a note.";
            toggleButton.textContent = "Stop";
            toggleButton.classList.add("stop");

            const loop = () => {
               if (!running) return;
               analyser.getFloatTimeDomainData(buffer);
               const [pitch, clarity] = detector.findPitch(buffer, audioContext.sampleRate);
               updateUI(pitch, clarity);
               requestAnimationFrame(loop);
            };
            loop();
         } catch (err) {
            console.error(err);
            const message =
               err && err.name === "NotAllowedError"
                  ? "Microphone access denied. Please allow microphone access."
                  : err && err.name === "NotFoundError"
                     ? "No microphone detected on this device."
                     : "Microphone error: " + (err.message || err);
            errorEl.textContent = message;
         } finally {
            starting = false;
            toggleButton.disabled = false;
         }
      }

      function stopTuner() {
         running = false;
         if (audioContext) {
            audioContext.close();
            audioContext = null;
         }
         if (micStream) {
            micStream.getTracks().forEach(track => track.stop());
            micStream = null;
         }
         analyser = null;
         detector = null;
         buffer = null;
         toggleButton.textContent = "Start";
         toggleButton.classList.remove("stop");
         noteEl.textContent = "—";
         noteEl.classList.remove("note-hit", "note-miss");
         indicatorEl.style.left = "50%";
         errorEl.textContent = "";
         clearTimeout(pendingNoteAnnouncement);
         pendingNoteStatus = "";
         announcedNoteStatus = "";
         noteStatusEl.textContent = "Tuner stopped.";
      }

      function setInstrument(semitones, btn) {
         if (running) {
            errorEl.textContent = "Stop the tuner to change the instrument key.";
            return;
         }
         transpose = semitones;
         keyButtons.forEach(b => b.classList.remove("active"));
         if (btn) btn.classList.add("active");
         errorEl.textContent = "";
      }

      keyButtons.forEach(btn => {
         btn.addEventListener("click", () => {
            const val = Number(btn.dataset.transpose || 0);
            setInstrument(val, btn);
         });
      });
      setInstrument(0, keyButtons[0]);

      toggleButton.addEventListener("click", () => {
         if (!running) {
            startTuner();
         } else {
            stopTuner();
         }
      });
   </script>
</body>

</html>
